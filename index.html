<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f3ec">
  <title>2048 · 再走一步</title>
  <link rel="stylesheet" href="style.css">
  <script src="engine.js" defer></script>
  <script src="game.js" defer></script>
</head>
<body>
  <main class="game">
    <header>
      <div class="eyebrow"><span></span> 数字之间，藏着无限可能</div>
      <div class="heading"><div><h1>2048<span>.</span></h1><p class="subtitle">合并数字，再走一步。</p></div><div class="scores"><div class="score-box"><span>当前分数</span><strong id="score">0</strong></div><div class="score-box best"><span>最高记录</span><strong id="best">0</strong></div></div></div>
    </header>
    <div class="toolbar"><p>让相同的数字相遇，拼出 <b>2048</b>。</p><button id="restart" class="primary">↻ 新的一局</button></div>
    <section class="board-wrap" aria-label="2048 游戏区">
      <div id="board" class="board" role="grid" aria-label="4 行 4 列数字棋盘"></div>
      <div id="overlay" class="overlay" hidden><div class="dialog"><span id="result-icon" class="result-icon">✦</span><h2 id="result-title"></h2><p id="result-text"></p><button id="continue" class="primary">继续挑战</button><button id="retry" class="secondary">再玩一局</button></div></div>
    </section>
    <div class="below-board"><span id="status" role="status" aria-live="polite">新的开始，祝你好运。</span><button id="undo" class="text-button" disabled>↶ 撤销一步</button></div>
    <section class="instructions"><h2>小小规则，大大挑战</h2><p>使用 <kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> 或 <b>W A S D</b> 移动。相同数字相撞时会合并，每步有效移动后出现一个新数字。</p><p>手机上在棋盘滑动即可。无法移动时游戏结束。</p></section>
    <footer><span>慢慢想，步步有惊喜。</span><span>MADE FOR A LITTLE BREAK</span></footer>
  </main>
</body>
</html>
